[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codex32"
version = "1.0.0rc1"
authors = [
  { name = "Ben Westgate", email = "benwestgate@protonmail.com" },
]
description = "Python reference implementation for codex32 (BIP93) and codex32-encoded master seeds."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE*"]
maintainers = [
  { name = "Ben Westgate", email = "benwestgate@protonmail.com" },
]
keywords = ["bitcoin", "HD wallet", "BIP32", "BIP93", "BIP173", "BIP350", "codex32", "cryptography", "secret sharing", "secrets", "entropy", "bech32"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.scripts]
codex32 = "codex32.cli:main"
ms32 = "codex32.cli:ms_main"
codex32-gui = "codex32_gui.__main__:main"

[project.optional-dependencies]
gui = [
  "pygobject>=3.50",
]
dev = [
  "build>=1,<2",
  "hypothesis>=6,<7",
  "mypy",
  "pytest",
  "ruff==0.16.2",
  "twine>=5,<7",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# PyGObject is a system package with no type information for this project.
module = ["gi", "gi.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Widget base classes therefore arrive as Any; the GUI still checks everything else.
module = ["codex32_gui.*"]
disallow_subclassing_any = false

[tool.ruff]
line-length = 110

[project.urls]
Homepage = "https://github.com/benwestgate/python-codex32"
Repository = "https://github.com/benwestgate/python-codex32"
Issues = "https://github.com/benwestgate/python-codex32/issues"
